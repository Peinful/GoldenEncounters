<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PokeDex | Golden Encounters</title>
    <link rel="icon" type="image/x-icon" href="images/favicon.ico">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Exo+2:ital,wght@0,700;0,900;1,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <script src="components/loader.js" defer></script>
  </head>
  <body>
    <canvas id="sparkle-canvas"></canvas>
    <div id="global-navbar"></div>
    <main class="relative z-10 pt-32 pb-24 px-4 max-w-7xl mx-auto">
      <div class="text-center mb-12">
        <h2 class="exo text-5xl font-black italic gold-metallic uppercase mb-4 tracking-tighter">Shiny Dex</h2>
        <p class="text-xs font-bold uppercase tracking-[0.25em] text-slate-500 mb-8">All shiny sprites. Gen 1 through Gen 5.</p>
        <div class="grid grid-cols-3 gap-4 max-w-xl mx-auto mb-6 text-center">
          <div class="bg-white/[0.02] border border-white/5 rounded-2xl p-3 backdrop-blur-md">
            <strong id="stat-total" class="block text-2xl font-black text-amber-400">0</strong>
            <span class="text-[9px] font-bold text-slate-500 uppercase tracking-widest">Total Species</span>
          </div>
          <div class="bg-white/[0.02] border border-white/5 rounded-2xl p-3 backdrop-blur-md">
            <strong id="stat-hordes" class="block text-2xl font-black text-purple-400">0</strong>
            <span class="text-[9px] font-bold text-slate-500 uppercase tracking-widest">Horde Species</span>
          </div>
          <div class="bg-white/[0.02] border border-white/5 rounded-2xl p-3 backdrop-blur-md">
            <strong id="stat-filtered" class="block text-2xl font-black text-emerald-400">0</strong>
            <span class="text-[9px] font-bold text-slate-500 uppercase tracking-widest">Filtered View</span>
          </div>
        </div>
        <div class="max-w-xl mx-auto space-y-5 bg-white/[0.01] p-6 rounded-3xl border border-white/5 backdrop-blur-md">
          <div class="search-bar flex items-center px-5 py-3.5 rounded-2xl">
            <i class="fas fa-search text-amber-500/60 mr-4 text-sm"></i>
            <input type="text" id="pokedex-search" placeholder="Search by name, ID number, or route..." class="bg-transparent border-none outline-none w-full text-white placeholder:text-slate-600 font-semibold text-sm">
          </div>
          <div class="flex flex-wrap justify-center gap-2" id="category-filters">
            <button class="filter-btn active" data-category="all"><i class="fas fa-list"></i> All</button>
            <button class="filter-btn" data-category="horde5x"><i class="fas fa-users"></i> Hordes 5x</button>
            <button class="filter-btn" data-category="horde3x"><i class="fas fa-users"></i> Hordes 3x</button>
            <button class="filter-btn" data-category="lure"><i class="fas fa-fish"></i> Lure</button>
            <button class="filter-btn" data-category="egg"><i class="fas fa-egg"></i> Egg</button>
            <button class="filter-btn" data-category="honey"><i class="fas fa-tree"></i> Honey Tree</button>
            <button class="filter-btn" data-category="fossil"><i class="fas fa-bone"></i> Fossil</button>
            <button class="filter-btn" data-category="grass"><i class="fas fa-leaf"></i> Grass</button>
            <button class="filter-btn" data-category="water"><i class="fas fa-water"></i> Water</button>
            <button class="filter-btn" data-category="cave"><i class="fas fa-mountain"></i> Cave</button>
          </div>
          <div class="flex flex-wrap justify-center gap-1.5 border-t border-white/5 pt-4" id="generation-filters">
            <button class="text-[9px] font-black uppercase tracking-widest text-slate-500 hover:text-amber-400 px-2 py-1 rounded transition-colors active" data-gen="all">All Gens</button>
            <button class="text-[9px] font-black uppercase tracking-widest text-slate-500 hover:text-amber-400 px-2 py-1 rounded transition-colors" data-gen="1">Gen 1</button>
            <button class="text-[9px] font-black uppercase tracking-widest text-slate-500 hover:text-amber-400 px-2 py-1 rounded transition-colors" data-gen="2">Gen 2</button>
            <button class="text-[9px] font-black uppercase tracking-widest text-slate-500 hover:text-amber-400 px-2 py-1 rounded transition-colors" data-gen="3">Gen 3</button>
            <button class="text-[9px] font-black uppercase tracking-widest text-slate-500 hover:text-amber-400 px-2 py-1 rounded transition-colors" data-gen="4">Gen 4</button>
            <button class="text-[9px] font-black uppercase tracking-widest text-slate-500 hover:text-amber-400 px-2 py-1 rounded transition-colors" data-gen="5">Gen 5</button>
          </div>
        </div>
      </div>
      <div id="pokedex-grid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-4 lg:gap-6"></div>
    </main>

      let allPokemon = [];
      let encounterMap = {};
      let currentFilter = 'all';
      let currentGenFilter = 'all';
      let searchQuery = '';

      function getGenerationFromId(id) {
        if (id >= 1 && id <= 151) return 1;
        if (id >= 152 && id <= 251) return 2;
        if (id >= 252 && id <= 386) return 3;
        if (id >= 387 && id <= 493) return 4;
        if (id >= 494 && id <= 649) return 5;
        return 1;
      }

      function formatPokemonName(name) {
        return name.split('-').map(w => w.charAt(0).toUpperCase() + w.slice(1)).join(' ');
      }

      function compileEncounterData(data) {
        const parsedMap = {};
        Object.values(data).forEach(categoryArray => {
          categoryArray.forEach(enc => {
            const cleanName = enc.pokemon.toLowerCase().trim();
            if (!parsedMap[cleanName]) parsedMap[cleanName] = [];
            parsedMap[cleanName].push({ location: `${enc.region_name}: ${enc.location}`, method: enc.type });
          });
        });
        return parsedMap;
      }

      function setupControls() {
        document.getElementById('pokedex-search').addEventListener('input', (e) => {
          searchQuery = e.target.value.toLowerCase().trim();
          render();
        });
        document.querySelectorAll('#category-filters .filter-btn').forEach(btn => {
          btn.addEventListener('click', () => {
            document.querySelectorAll('#category-filters .filter-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            currentFilter = btn.dataset.category;
            render();
          });
        });
        document.querySelectorAll('#generation-filters button').forEach(btn => {
          btn.addEventListener('click', () => {
            document.querySelectorAll('#generation-filters button').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            currentGenFilter = btn.dataset.gen;
            render();
          });
        });
      }

      function hideProgressBar() {
        setTimeout(() => {
          const bar = document.getElementById('progress-bar');
          const txt = document.getElementById('status-text');
          if (bar) bar.style.opacity = '0';
          if (txt) txt.style.opacity = '0';
        }, 1000);
      }

      const RARITY_MAP = (() => {
        const combined = { ...simpleCategoryMapBase };
        for (const [id, categories] of Object.entries(categoryAdditions)) {
          combined[id] = [...(combined[id] || []), ...categories];
        }
        return combined;
      })();

      function render() {
        const grid = document.getElementById('pokedex-grid');
        if (!grid) return;
        const filtered = allPokemon.filter(p => {
          const encs = encounterMap[p.apiName] || [];
          const rarityData = RARITY_MAP[p.id] || [];
          const m = encs.map(e => e.method.toLowerCase()).join(' ');
          const l = encs.map(e => e.location.toLowerCase()).join(' ');
          const textMatch = p.name.toLowerCase().includes(searchQuery) || p.id.toString() === searchQuery;
          const genMatch = currentGenFilter === 'all' || p.generation.toString() === currentGenFilter;
          let catMatch = true;
          if (currentFilter !== 'all') {
            if (currentFilter === 'horde5x') catMatch = rarityData.some(r => r === 'Horde 5x') || m.includes('5x');
            else if (currentFilter === 'horde3x') catMatch = rarityData.some(r => r === 'Horde 3x') || m.includes('3x');
            else if (currentFilter === 'lure') catMatch = rarityData.some(r => r.toLowerCase() === 'lure');
            else if (currentFilter === 'egg') catMatch = rarityData.some(r => r.toLowerCase() === 'egg');
            else if (currentFilter === 'honey') catMatch = l.includes('honey tree');
            else if (currentFilter === 'fossil') catMatch = rarityData.some(r => r.toLowerCase() === 'fossil');
            else if (currentFilter === 'water') catMatch = m.includes('surf') || m.includes('fish') || m.includes('rod');
            else if (currentFilter === 'grass') catMatch = m.includes('grass') || m.includes('walk');
            else if (currentFilter === 'cave') catMatch = l.includes('cave') || l.includes('tunnel') || l.includes('mountain') || m.includes('cave');
          }
          return textMatch && catMatch && genMatch;
        });

        document.getElementById('stat-total').textContent = allPokemon.length;
        document.getElementById('stat-filtered').textContent = filtered.length;
        document.getElementById('stat-hordes').textContent = allPokemon.filter(p => (encounterMap[p.apiName] || []).some(e => e.method.toLowerCase().includes('3x') || e.method.toLowerCase().includes('5x')) || (RARITY_MAP[p.id] || []).some(r => r.includes('Horde'))).length;

        grid.innerHTML = filtered.map(p => `
          <div class="pokemon-card glass-panel p-5 flex flex-col items-center cursor-pointer" onclick="this.classList.toggle('expanded')">
            <div class="generation-badge absolute top-2 right-3 bg-white/5">GEN ${p.generation}</div>
            <div class="absolute top-2 left-3 text-[9px] font-black text-amber-500/50">#${p.id.toString().padStart(3, '0')}</div>
            <img src="${SPRITE_BASE}${p.filename}" class="sprite-container w-20 h-20 object-contain" onerror="this.src='https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/shiny/${p.id}.png'">
            <h3 class="exo text-base font-black text-white mt-3 uppercase">${p.name}</h3>
            <div class="flex gap-1 mt-2">
              ${(RARITY_MAP[p.id] || []).map(r => `<span class="text-[8px] font-bold bg-amber-500/20 text-amber-500 px-1.5 py-0.5 rounded">${r}</span>`).join('')}
            </div>
            <div class="detail-pane w-full mt-3">
              <div class="bg-black/40 rounded-xl p-3 border border-white/5">
                ${(encounterMap[p.apiName] || []).slice(0, 4).map(e => `
                  <div class="flex justify-between items-center text-[9px] py-1 border-b border-white/5 last:border-0">
                    <span class="text-slate-400 truncate pr-2">${e.location}</span>
                    <span class="text-amber-500 font-bold">${e.method}</span>
                  </div>
                `).join('') || '<p class="text-[9px] text-slate-500 italic">No encounter data</p>'}
              </div>
            </div>
          </div>
        `).join('');
      }

      async function init() {
        const status = document.getElementById('status-text');
        try {
          const pokeRes = await fetch("https://pokeapi.co/api/v2/pokemon?limit=649");
          const pokeJson = await pokeRes.json();
          allPokemon = pokeJson.results.map((p, i) => ({
            id: i + 1,
            apiName: p.name.toLowerCase().trim(),
            name: formatPokemonName(p.name),
            filename: `${i + 1}.png`,
            generation: getGenerationFromId(i + 1)
          }));
          const locRes = await fetch("location.json");
          const rawLocData = await locRes.json();
          encounterMap = compileEncounterData(rawLocData);
          if (status) status.textContent = "Data Engine Live";
          setupControls();
          render();
          hideProgressBar();
        } catch (err) {
          console.error("Init Error:", err);
          if (status) status.textContent = "Error: Check Console";
        }
      }

      const canvas = document.getElementById('sparkle-canvas');
      const ctx = canvas.getContext('2d');
      let particles = [];
      function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
      window.addEventListener('resize', resize);
      resize();
      class Particle {
        constructor() { this.init(); }
        init() {
          this.x = Math.random() * canvas.width;
          this.y = Math.random() * canvas.height;
          this.size = Math.random() * 1.5;
          this.speedY = Math.random() * -0.3;
          this.opacity = Math.random();
          this.fade = 0.001 + Math.random() * 0.003;
        }
        update() { this.y += this.speedY; this.opacity -= this.fade; if (this.opacity <= 0) this.init(); }
        draw() {
          ctx.fillStyle = `rgba(251, 191, 36, ${this.opacity * 0.2})`;
          ctx.beginPath();
          ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
          ctx.fill();
        }
      }
      for (let i = 0; i < 80; i++) particles.push(new Particle());
      function animate() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        particles.forEach(p => { p.update(); p.draw(); });
        requestAnimationFrame(animate);
      }
      animate();
      init();
    </script>
  </body>
</html>
